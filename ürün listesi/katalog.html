      color: #94a3b8;

      z-index: 100;

    const grid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const catButtons = document.querySelectorAll('.cat-btn');
    const counterBadge = document.getElementById('productCount');
    let activeCategory = 'all';

    function renderCards(items) {
      grid.innerHTML = items.map(p => `
        <div class="card" data-sec="${p.section.slice(0, 1)}">
          <span class="card-index">#${p.index}</span>
          <div class="card-img-wrapper" onclick="openModal('${p.imagePath}', '${escapeQuotes(p.title)}', '${escapeQuotes(p.details)}')">
            <img class="card-img" src="${p.imagePath}" alt="${p.title}" loading="lazy">
          </div>
          <span class="badge">${p.subsection || p.section.split('.')[1]?.trim() || p.section}</span>
          <h3 class="card-title">${p.title}</h3>
          <p class="card-details">${p.details || 'Orijinal Ambalaj'}</p>
        </div>
      `).join('');
      counterBadge.textContent = `${items.length} Ürün`;
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function filterProducts() {
      const query = searchInput.value.trim().toLocaleLowerCase('tr-TR');
      const filtered = products.filter(p => {
        const matchCat = (activeCategory === 'all') || (p.section.startsWith(activeCategory));
        const fullText = (p.title + ' ' + p.details + ' ' + p.section + ' ' + (p.subsection || '')).toLocaleLowerCase('tr-TR');
        const matchSearch = query === '' || fullText.includes(query);
        return matchCat && matchSearch;
      });
      renderCards(filtered);
    }

    searchInput.addEventListener('input', filterProducts);

    catButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        catButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-cat');
        filterProducts();
      });
    });

    function openModal(imgSrc, title, details) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalDetails').textContent = details;
      document.getElementById('imageModal').classList.add('open');
    }

    function closeModal(e) {
      document.getElementById('imageModal').classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    renderCards(products);
  </script>
